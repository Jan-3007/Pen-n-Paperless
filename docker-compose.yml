version: '3.8'

services:
  web:
    build: .
    # remove platform line to let Docker pick appropriate manifest for your Pi
    # platform: linux/arm/v7  # optional: uncomment for some Pi models
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=run.py
      - SECRET_KEY=change-this-in-production
    volumes:
      - ./app/data:/app/app/data
    restart: unless-stopped
